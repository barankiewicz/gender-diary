# What the Journal origin serves, and how it caches it (phase 2 ticket 05).
# Installed as /etc/nginx/snippets/gender-diary-journal-site.conf and included
# from the TLS server block in journal.conf.
#
# Separate from journal.conf so that `listen`, `server_name`, `root` and
# everything certbot writes stay out of it: this file is then includable
# unchanged by the harness in tests/hosting/nginx.mjs, which runs the real rules
# in a container over a plain port. What that harness cannot cover is the TLS
# and the redirect, which are certbot's rather than this repository's.
#
# The root is set by the block that includes this, and on the box it is a
# symlink - /home/journal/current - that deploy/journal-release.sh moves. nginx
# resolves it per request, so the switch between releases needs no reload and
# no request can straddle two of them.

index index.html;
charset utf-8;

# Sized for the SQLite WASM, which is the largest thing here by an order of
# magnitude and compresses well.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json application/manifest+json application/wasm image/svg+xml;

# Nothing here is a form post or an upload; the Journal never sends its contents
# anywhere. A request body is either a mistake or an attempt.
client_max_body_size 1k;

# Hashed by the build: the name changes whenever the bytes do, so a copy of one
# of these is good until the heat death of the cache. This is the half of the
# cache policy that makes an update cheap - and, with the release directories
# being immutable too, the half that means a page can never be served chunks
# from a release it did not come from.
location /_app/immutable/ {
    include snippets/gender-diary-journal-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# nginx has no type for this extension - it does have one for .wasm - and a
# manifest served as text/plain is a manifest the browser ignores, which shows
# up as an app that cannot be installed rather than as an error.
location = /manifest.webmanifest {
    types { }
    default_type application/manifest+json;
    include snippets/gender-diary-journal-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}

# Everything else: the document, the service worker, the version files, the
# fonts and the icons. no-cache stores the response and revalidates it, which is
# what keeps one load from mixing release generations - the document names this
# release's chunks, so a stale one names the previous release's. The unhashed
# static files sit here rather than with the immutable ones for the same reason:
# their names do not change when their contents do.
#
# The fallback is the SPA rule. Every route in this app renders from one
# document, so a path with no file behind it is a route rather than a 404 - and
# once the service worker is installed it answers navigations from the precached
# copy anyway, which makes this the rule for the first load and for a browser
# that will not run a worker.
location / {
    include snippets/gender-diary-journal-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
}

# Nothing about the app's own paths, so it never reaches the fallback above and
# turns into a 200 with the app in it.
location = /robots.txt {
    include snippets/gender-diary-journal-headers.conf;
    add_header Cache-Control "no-cache" always;
    default_type text/plain;
    return 200 "User-agent: *\nDisallow: /\n";
}

# Dotfiles: nothing in a release directory begins with one, so a request for
# such a path is looking for something it has been told to expect.
location ~ /\. {
    deny all;
}

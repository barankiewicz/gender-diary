# Nginx server blocks for the production Journal origin (phase 2 ticket 05).
# Install as /etc/nginx/sites-available/gender-diary-journal.conf, then enable
# it from sites-enabled. certbot owns the certificate paths.

server {
    listen 80;
    listen [::]:80;
    server_name app.genderdiary.barankiewicz.dev;

    # Keep HTTP as a strict redirect target only.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.genderdiary.barankiewicz.dev;

    # certbot-managed certificate for this exact origin.
    ssl_certificate /etc/letsencrypt/live/app.genderdiary.barankiewicz.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.genderdiary.barankiewicz.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # The symlink this ticket's deploy/rollback command moves atomically.
    root /home/journal/current;

    include snippets/gender-diary-journal-site.conf;
}

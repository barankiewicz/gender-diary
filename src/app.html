<!doctype html>
<html lang="%paraglide.locale%" data-palette="trans" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F4F8FB" />
    <!-- Both above the script below, which swaps them for their neutral
         counterparts when the app is disguised (F24). The order matters: the
         script can only reach an element the parser has already seen, and the
         swap has to happen in the same parse tick - before the tab paints a
         flag, and before the browser reads the manifest it would install the
         app under.

         Production hosting has to map the .webmanifest extension to
         application/manifest+json; nginx's default mime.types does not. -->
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <script>
      /* Stamps the user's theme, palette and tab icon before first paint
         (ADR-0009).
         The attributes on <html> above are only what a first-ever visit,
         or a visit where this throws, falls back to; SQLite is still
         hundreds of milliseconds from opening at this point, which is why
         these six preferences are mirrored outside it at all.

         Inline and dependency-free because it has to run before any module
         is parsed, so it cannot import the key or the shape - both are
         owned by src/lib/data/prefs/boot-cache.ts and have to be changed
         in the two places together. */
      try {
        const boot = JSON.parse(localStorage.getItem('gender-diary-boot-prefs') || '{}');
        const root = document.documentElement;
        if (boot.palette) root.dataset.palette = boot.palette;
        root.dataset.theme =
          !boot.theme || boot.theme === 'system'
            ? matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : boot.theme;
        /* Disguise is the one of these that cannot wait for the layout's
           effect: by then the flag icon has already been in the tab strip
           for as long as boot takes, and an install started in that window
           would have taken the app's real name with it. Both hrefs are
           derived from the links above rather than written out again, so
           the asset paths live in one place. */
        if (boot.disguise) {
          const icon = document.querySelector('link[rel="icon"]');
          icon.href = icon.href.replace('favicon.svg', 'favicon-notes.svg');
          const manifest = document.querySelector('link[rel="manifest"]');
          manifest.href = manifest.href.replace('manifest.webmanifest', 'manifest-notes.webmanifest');
        }
      } catch {
        /* no mirror yet, or storage is unavailable */
      }
    </script>
    <link rel="preload" href="%sveltekit.assets%/fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="%sveltekit.assets%/fonts/baloo2-latin.woff2" as="font" type="font/woff2" crossorigin />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>

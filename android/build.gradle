// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    // capacitor-cordova-android-plugins pulls a Cordova plugin that still
    // depends on the standalone kotlin-stdlib-jdk7/jdk8 artifacts; Kotlin
    // 1.8 folded both into kotlin-stdlib itself, so every class in them
    // collides with the same class in kotlin-stdlib and
    // checkDebugAndroidTestDuplicateClasses refuses to package the test APK.
    configurations.all {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
